name: almeida-e2e

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: almeidajj
    volumes:
      - ${ALMEIDA_API_DIR:-../../almeidaPresenca}/Docker/postgres/init.sql:/docker-entrypoint-initdb.d/1-init.sql:ro
      - ${ALMEIDA_API_DIR:-../../almeidaPresenca}/Docker/postgres/populate.sql:/docker-entrypoint-initdb.d/2-populate.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d almeidajj']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '18025:8025'

  api:
    build:
      context: ${ALMEIDA_API_DIR:-../../almeidaPresenca}
    environment:
      DB_URL: jdbc:postgresql://db:5432/almeidajj
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      TOKEN_SECRET: segredo-somente-para-testes-e2e-nao-usar-em-producao
      URL_FRONTEND: http://localhost:4300
      MAIL_PROVIDER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: '1025'
      MAIL_USER: academia@almeidajj.test
      MAIL_PASSWORD: qualquer
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - '18080:8080'
