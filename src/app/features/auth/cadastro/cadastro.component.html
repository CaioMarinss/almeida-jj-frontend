<app-layout-auth titulo="Criar conta" subtitulo="Cadastre-se para acompanhar seus treinos.">
  <form class="ajj-auth-form" [formGroup]="cadastroForm" (keyup.enter)="submit()">
    <app-campo [formGroup]="cadastroForm" formControlName="nome" controlName="nome" inputName="nome" type="text"
      label="Nome completo" placeholder="Seu nome" autocomplete="name" />
    <app-campo [formGroup]="cadastroForm" formControlName="cpf" controlName="cpf" inputName="cpf" type="text"
      label="CPF" placeholder="000.000.000-00" formato="cpf" />
    <app-campo [formGroup]="cadastroForm" formControlName="email" controlName="email" inputName="email" type="email"
      label="E-mail" placeholder="seu@email.com" autocomplete="email" />
    <app-campo [formGroup]="cadastroForm" formControlName="senha" controlName="senha" inputName="senha" type="password"
      label="Senha" placeholder="Crie uma senha forte" autocomplete="new-password" />
    <ajj-regras-senha [senha]="senha()" />
    <app-campo [formGroup]="cadastroForm" formControlName="passwordConfirm" controlName="passwordConfirm"
      inputName="passwordConfirm" type="password" label="Confirme a senha" placeholder="Repita a senha"
      autocomplete="new-password" />

    <div class="ajj-auth-acoes">
      <ajj-botao [carregando]="enviando()" (clique)="submit()">Criar conta</ajj-botao>
    </div>
  </form>

  <p class="ajj-rodape-auth">
    Já tem conta?
    <button type="button" class="ajj-link" (click)="irParaLogin()">Entrar</button>
  </p>
</app-layout-auth>
