<app-layout-auth [primeiroBotaoDesabilitado]="enviando()" primeiroBotao="Cadastrar" segundoBotao="Faça login" (submit)="submit()"
    (navigate)="irParaLogin()">

    <form [formGroup]="cadastroForm">

        <app-campo [formGroup]="cadastroForm" [formControlName]="'nome'" [controlName]="'nome'" [inputName]="'name'" [type]="'text'"
            [label]="'Digite seu nome'" [placeholder]="'Nome'">
            <img src="/assets/svg/user-svgrepo-com.svg" height="20px" />
        </app-campo>

        <app-campo [formGroup]="cadastroForm" [formControlName]="'cpf'" [controlName]="'cpf'" [inputName]="'cpf'"
            [type]="'text'" [label]="'Digite seu CPF'" [placeholder]="'123.456.789-01'" formato="cpf">
            <img src="/assets/svg/user-svgrepo-com.svg" height="20px" />
        </app-campo>

        <app-campo [formGroup]="cadastroForm" [formControlName]="'email'" [controlName]="'email'" [inputName]="'email'"
            [type]="'email'" [label]="'Digite seu e-mail'" [placeholder]="'E-mail'">
            <img src="/assets/svg/email-svgrepo-com.svg" height="20px" />
        </app-campo>
        
        <app-campo [formGroup]="cadastroForm" [formControlName]="'senha'" [controlName]="'senha'" [inputName]="'senha'"
            [type]="'password'" [label]="'Digite sua senha'" [placeholder]="'**********'">
            <img src="/assets/svg/padlock-svgrepo-com.svg" height="20px" />
        </app-campo>

        <app-campo [formGroup]="cadastroForm" [formControlName]="'passwordConfirm'" [controlName]="'passwordConfirm'"
            [inputName]="'passwordConfirm'" [type]="'password'" [label]="'Confirme sua senha'"
            [placeholder]="'**********'">
            <img src="/assets/svg/padlock-svgrepo-com.svg" height="20px" />
        </app-campo>


    </form>

</app-layout-auth>
