<app-layout-auth 
title="Vamos trocar a senha?" 
primeiroBotao="Alterar" 
segundoBotao="Voltar"
(submit)="submit()" 
(navigate)="voltar()"
[primeiroBotaoDesabilitado]="!linkValido() || enviando()"
>

    @if (!linkValido()) {
        <p>Link inválido ou expirado.</p>
    }

    <form [formGroup]="formSenha">
        <app-campo [formGroup]="formSenha" [formControlName]="'novaSenha'" [controlName]="'novaSenha'" [inputName]="'novaSenha'" [type]="'password'"
            [label]="'Qual será sua nova senha?'" [placeholder]="'Nova senha'">
            <img src="/assets/svg/padlock-svgrepo-com.svg" height="20px" />
        </app-campo>
        <app-campo [formGroup]="formSenha" [formControlName]="'confirmarSenha'" [controlName]="'confirmarSenha'" [inputName]="'confirmarSenha'" [type]="'password'"
            [label]="'Confirme sua nova senha...'" [placeholder]="'Repita a senha'">
            <img src="/assets/svg/padlock-svgrepo-com.svg" height="20px" />
        </app-campo>

        
    </form>

</app-layout-auth>
