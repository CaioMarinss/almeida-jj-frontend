<app-layout-auth [primeiroBotaoDesabilitado]="enviando()" 
title="Vamos verificar seu email!" 
primeiroBotao="Enviar email" 
segundoBotao="Voltar"
(submit)="submit()" 
(navigate)="voltar()"
>

    <form [formGroup]="emailForm">
        <app-campo [formGroup]="emailForm" [formControlName]="'email'" [controlName]="'email'" [inputName]="'email'" [type]="'email'"
            [label]="'Digite seu e-mail'" [placeholder]="'E-mail'">
            <img src="/assets/svg/email-svgrepo-com.svg" height="20px" />
        </app-campo>

        
    </form>

</app-layout-auth>
