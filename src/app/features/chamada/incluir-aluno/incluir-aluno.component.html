<div class="painel">
  <strong id="painel-incluir-titulo" class="ajj-titulo">Incluir aluno</strong>

  <div class="campo">
    <label for="busca-incluir" class="ajj-rotulo">Buscar aluno</label>
    <input
      id="busca-incluir"
      #campo
      type="search"
      autocomplete="off"
      placeholder="Nome do aluno"
      [value]="busca()"
      (input)="busca.set(campo.value)"
    />
  </div>

  @if (filtradas().length > 0) {
    <ul class="lista">
      @for (pessoa of filtradas(); track pessoa.id) {
        <li>
          <button type="button" class="pessoa" [disabled]="salvando()" (click)="escolher.emit(pessoa)">
            <strong class="ajj-truncar">{{ pessoa.nome }}</strong>
            <span class="ajj-suave ajj-truncar">{{ pessoa.email }}</span>
          </button>
        </li>
      }
    </ul>
  } @else {
    <p class="ajj-suave vazio" role="status">Nenhum aluno encontrado.</p>
  }

  <button type="button" class="cancelar" (click)="fechar.emit()">Cancelar</button>
</div>
