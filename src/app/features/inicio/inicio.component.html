<ion-content>
  <div class="ajj-coluna">
    <header class="saudacao">
      <div class="saudacao-texto">
        <span class="ajj-rotulo">Oss,</span>
        <h1 class="saudacao-nome ajj-truncar">{{ primeiroNome() }}</h1>
      </div>
      <span class="avatar" aria-hidden="true">{{ inicial() }}</span>
    </header>

    @if (ehDono()) {
      <app-area-dono />
    }

    @if (ehProfessor()) {
      <section class="ajj-card atalho-chamada" aria-label="Atalho da chamada">
        <ajj-botao variante="secundario" class="chamada" (clique)="abrirChamada()">Chamada</ajj-botao>
      </section>
    }

    @if (proxima(); as p) {
      <section class="ajj-card proxima-aula" aria-labelledby="proxima-aula-titulo">
        <span class="ajj-rotulo" id="proxima-aula-titulo">Próxima aula</span>
        <div class="linha">
          <div class="info">
            <strong class="hora">{{ p.aula.inicio }}</strong>
            <span class="quando">{{ quando() }}</span>
            <span class="detalhe">
              <span class="chip ajj-chip-modalidade" [class]="classeChip[p.aula.modalidade]">{{ rotulo[p.aula.modalidade] }}</span>
              @if (contador(); as texto) {
                <span class="contador">{{ texto }}</span>
              }
            </span>
          </div>
          <app-botao-vou [aula]="p.aula" [salvando]="salvando()" (alternar)="alternarPresenca($event)" />
        </div>
      </section>
    }

    <app-card-graduacao />

    <div class="resumo">
      <section class="ajj-card">
        <span class="ajj-rotulo">No mês</span>
        <p class="em-breve">Em breve</p>
      </section>
      <section class="ajj-card">
        <span class="ajj-rotulo">Mensalidade</span>
        <p class="em-breve">Em breve</p>
      </section>
    </div>
  </div>
</ion-content>
