<app-layout-app
  [heading]="'Configurações do perfil'"
  [title]="'Perfil'"
  [navItems]="[
    { label: 'Visão geral', route: '/dashboard' },
    { label: 'Treinos', route: '/calendario' },
    { label: 'Financeiro', route: '/financeiro' },
    { label: 'Configurações', route: '/configuracoes', active: true }
  ]"
>
  <section class="settings-page">
    <div class="settings-card profile-card">
      <div class="profile-header">
        <div class="avatar-block">
          <img [src]="imagemPerfil()" alt="Foto do perfil" />
          <label class="upload-button" for="profile-image-input">Alterar foto</label>
          <input
            id="profile-image-input"
            type="file"
            accept="image/*"
            (change)="aoTrocarImagem($event)"
          />
        </div>

        <div class="profile-summary">
          <p class="eyebrow">Dados pessoais</p>
          <h2>{{ nome() }}</h2>
          <span>{{ perfil() }}</span>
        </div>
      </div>
    </div>

    <div class="settings-card form-card">
      <div class="form-header">
        <p class="eyebrow">Editar perfil</p>
        <h3>Personalize seu nome e foto</h3>
      </div>

      <div class="field-group">
        <label for="display-name">Nome completo</label>
        <input
          id="display-name"
          type="text"
          [(ngModel)]="nomeEditado"
          placeholder="Digite seu nome"
        />
      </div>

      <div class="field-group">
        <label for="email">E-mail</label>
        <input id="email" type="email" [value]="email()" disabled />
      </div>

      <div class="password-card">
        <div class="form-header">
          <p class="eyebrow">Segurança</p>
          <h3>Trocar senha</h3>
        </div>

        <div class="field-group">
          <label for="current-password">Senha atual</label>
          <input
            id="current-password"
            type="password"
            [(ngModel)]="senhaAtual"
            placeholder="Digite sua senha atual"
          />
        </div>

        <div class="field-group">
          <label for="new-password">Nova senha</label>
          <input
            id="new-password"
            type="password"
            [(ngModel)]="novaSenha"
            placeholder="Digite sua nova senha"
          />
        </div>

        <div class="field-group">
          <label for="confirm-password">Confirmar nova senha</label>
          <input
            id="confirm-password"
            type="password"
            [(ngModel)]="confirmacaoSenha"
            placeholder="Confirme a nova senha"
          />
        </div>

      </div>

      <div class="actions">
        <button type="button" class="secondary-button">Cancelar</button>
        <button type="button" class="primary-button" (click)="salvar()">Salvar alterações</button>
      </div>
    </div>
  </section>

  <app-dialogo-confirmacao
    [visible]="confirmandoSenha()"
    title="Trocar senha"
    message="Tem certeza que deseja alterar sua senha?"
    confirmLabel="Sim"
    cancelLabel="Não"
    (confirm)="confirmarTrocaDeSenha()"
    (cancel)="confirmandoSenha.set(false)"
  ></app-dialogo-confirmacao>
</app-layout-app>
