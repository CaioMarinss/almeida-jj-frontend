<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="ajj-coluna">
    <section class="ajj-card identidade" aria-label="Seus dados">
      <span class="avatar" aria-hidden="true">{{ inicial() }}</span>
      <div class="dados">
        <strong class="nome ajj-truncar">{{ nome() }}</strong>
        <span class="email ajj-truncar ajj-suave">{{ email() }}</span>
      </div>
      <span class="ajj-chip">{{ perfil() }}</span>
    </section>

    <button type="button" class="ajj-card trocar-senha" (click)="abrirTrocarSenha()">
      <svg lucideKeyRound aria-hidden="true"></svg>
      <span class="rotulo">Trocar senha</span>
      <svg lucideChevronRight aria-hidden="true" class="seta"></svg>
    </button>

    <ajj-botao variante="texto" class="sair" (clique)="sair()">Sair da conta</ajj-botao>
  </div>
</ion-content>
