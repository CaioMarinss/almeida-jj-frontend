<app-base-page [heading]="'Bem-vindo, ' + userName" [title]="'Dashboard'" [userName]="userName" [role]="role" [navItems]="[
  { label: 'Visão geral', route: '/dashboard', active: true },
  { label: 'Treinos', route: '/calendario' },
  { label: 'Financeiro', route: '/financeiro' },
  { label: 'Configurações', route: '/configuracoes' }
]">
  <section class="hero-card">
    <div class="hero-copy">
      <p class="eyebrow">Seu progresso</p>
      <h2>Sua rotina de treinos e evolução está organizada em um só lugar.</h2>
    </div>

    <button type="button" class="primary-action">Acessar agenda</button>
  </section>

  <section class="metrics" aria-label="Métricas do usuário">
    <article class="metric-card" *ngFor="let metric of metrics" [ngClass]="metric.tone">
      <span>{{ metric.label }}</span>
      <strong>{{ metric.value }}</strong>
    </article>
  </section>

  <section class="panel-grid">
    <article class="panel">
      <div class="panel-header">
        <h3>Ações rápidas</h3>
      </div>

      <div class="action-list">
        <button type="button" *ngFor="let action of quickActions" class="action-item">
          {{ action }}
        </button>
      </div>
    </article>

    <article class="panel">
      <div class="panel-header">
        <h3>Últimas atualizações</h3>
      </div>

      <ul class="updates-list">
        <li *ngFor="let item of recentItems">
          <span class="dot"></span>
          <div>
            <strong>{{ item.title }}</strong>
            <small>{{ item.meta }}</small>
          </div>
        </li>
      </ul>
    </article>
  </section>
</app-base-page>
