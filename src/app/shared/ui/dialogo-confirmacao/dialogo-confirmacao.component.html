@if (visible()) {
  <div class="dialog-backdrop" (click)="cancel.emit()">
    <div class="dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <div class="dialog-header">
        <h3>{{ title() }}</h3>
      </div>

      <p>{{ message() }}</p>

      <div class="dialog-actions">
        <button type="button" class="secondary" (click)="cancel.emit()">{{ cancelLabel() }}</button>
        <button type="button" class="primary" (click)="confirm.emit()">{{ confirmLabel() }}</button>
      </div>
    </div>
  </div>
}
