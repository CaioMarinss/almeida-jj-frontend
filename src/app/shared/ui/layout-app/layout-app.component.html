<div class="base-page-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <strong>Almeida JJ</strong>
        <span>Gestão da academia</span>
      </div>
    </div>

    <nav class="nav" aria-label="Menu principal">
      @for (item of navItems(); track item.label) {
        <button
          type="button"
          class="nav-item"
          [class.active]="item.active"
          [routerLink]="item.route ?? null"
          [disabled]="!item.route"
        >
          {{ item.label }}
        </button>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-card">
        <span class="label">Status</span>
        <strong>Operação ativa</strong>
        <p>Seu corpo e seu progresso estão em acompanhamento constante.</p>
      </div>

      <button type="button" class="logout-button" (click)="confirmandoSaida.set(true)">
        Sair
      </button>
    </div>
  </aside>

  <app-dialogo-confirmacao
    [visible]="confirmandoSaida()"
    title="Sair da conta"
    message="Tem certeza que deseja sair?"
    confirmLabel="Sim"
    cancelLabel="Não"
    (confirm)="confirmarSaida()"
    (cancel)="confirmandoSaida.set(false)"
  ></app-dialogo-confirmacao>

  <main class="content">
    <header class="topbar">
      <div>
        <p class="eyebrow">{{ title() }}</p>
        <h1>{{ heading() }}</h1>
      </div>

      <div class="user-badge">
        <span class="avatar">{{ inicial() }}</span>
        <div>
          <strong>{{ nome() }}</strong>
          <small>{{ perfil() }}</small>
        </div>
      </div>
    </header>

    <div class="page-slot">
      <ng-content></ng-content>
    </div>
  </main>
</div>
